    enabled: true

  servlet: #fileupload
    multipart:
      max-file-size: 20MB
      enabled: true

  mail: #email
    host: smtp.gmail.com
    port: 587
    username: dev.hsayho@gmail.com
    password: #appPassword
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        protocol: smtp

