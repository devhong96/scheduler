#test profile - in-memory H2 so tests run without the external MySQL
server:
  port: 0

spring:
  sql:
    init:
      mode: never

  datasource: # in-memory H2 in MySQL compatibility mode
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  mail: #email - dummy host; tests must not hit a real SMTP server
    host: localhost
    port: 3025
    username: test
    password: test
